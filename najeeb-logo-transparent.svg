<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">شعار شركة النجيب المتطورة لمعدات المغاسل</title>
  <desc id="desc">حرف N ذهبي مع قطرة ماء وغسالة داخل قوس دائري وموجة سفلية، بخلفية شفافة.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5a10"/>
      <stop offset="0.18" stop-color="#f0a51c"/>
      <stop offset="0.43" stop-color="#ffe17a"/>
      <stop offset="0.67" stop-color="#d68b0d"/>
      <stop offset="0.88" stop-color="#ffd85c"/>
      <stop offset="1" stop-color="#7a4b08"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset="0.42" stop-color="#f9bf32"/>
      <stop offset="1" stop-color="#a96008"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c3504"/>
      <stop offset="0.5" stop-color="#c17608"/>
      <stop offset="1" stop-color="#f6bb29"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#fff5b5" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffc12e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffc12e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#6f4108" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- transparent background by design -->

  <!-- enclosing golden orbit -->
  <path d="M116 342C79 177 190 56 351 52c120-3 219 62 265 157" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
  <path d="M120 342C98 238 155 144 243 94" fill="none" stroke="#ffd96b" stroke-width="4" stroke-linecap="round" opacity=".55"/>

  <!-- crescent and water sweep -->
  <path d="M157 212c-63 65-68 181 12 241 63 47 157 35 222-25-69 25-151 13-198-43-45-53-55-118-36-173z" fill="url(#gold)" filter="url(#shadow)"/>
  <path d="M151 409c77 60 210 43 312-8 63-31 112-54 180-29-83-10-137 33-212 72-98 51-220 52-280-35z" fill="url(#goldDark)"/>
  <path d="M158 452c105 35 231 4 328-38 51-22 93-29 138-15-63 3-103 31-159 60-99 51-223 72-307-7z" fill="url(#goldBright)"/>

  <!-- stylized N -->
  <path d="M225 161c0-19 13-33 31-33h37c12 0 21 5 29 16l132 176V162c0-19 13-32 31-32h26v259h-53c-13 0-23-5-31-16L286 201v146c0 20-13 33-32 33h-29V161z" fill="url(#goldBright)" filter="url(#shadow)"/>
  <path d="M279 145l163 220" fill="none" stroke="#fff3a4" stroke-width="5" stroke-linecap="round" opacity=".35"/>

  <!-- water droplet inside N -->
  <path d="M292 248c0 0-42 59-42 88 0 30 20 52 45 52s45-22 45-52c0-29-48-88-48-88z" fill="url(#gold)"/>
  <path d="M295 282c0 0-24 39-24 57 0 17 10 29 24 29s24-12 24-29c0-18-24-57-24-57z" fill="#fff0a0" opacity=".72"/>

  <!-- washing machine cabinet -->
  <g transform="translate(455 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="174" height="213" rx="13" fill="url(#goldBright)"/>
    <rect x="11" y="13" width="152" height="39" rx="9" fill="none" stroke="#9d6009" stroke-width="7"/>
    <rect x="25" y="25" width="77" height="10" rx="5" fill="#a26208"/>
    <circle cx="137" cy="32" r="9" fill="#8b5105"/>
    <circle cx="118" cy="32" r="6" fill="#8b5105"/>
    <circle cx="87" cy="128" r="61" fill="none" stroke="#7a4807" stroke-width="11"/>
    <circle cx="87" cy="128" r="45" fill="#fff1a1" fill-opacity=".28" stroke="#c57808" stroke-width="6"/>
    <path d="M45 139c25-16 39-6 56 10 12 12 28 12 42-3-10 27-30 42-55 42-24 0-43-17-43-49z" fill="url(#goldDark)" opacity=".9"/>
    <circle cx="106" cy="116" r="8" fill="#ad6807"/>
    <circle cx="126" cy="135" r="7" fill="#ad6807"/>
    <circle cx="111" cy="151" r="5" fill="#ad6807"/>
  </g>

  <!-- highlight arc and sparkle -->
  <path d="M287 73c101-32 211-7 287 62" fill="none" stroke="#fff2a1" stroke-width="4" stroke-linecap="round" opacity=".62"/>
  <g transform="translate(545 101)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="30" fill="url(#spark)"/>
    <path d="M0-31V31M-31 0H31" stroke="#fff7c0" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20-20L20 20M20-20L-20 20" stroke="#ffd75c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
